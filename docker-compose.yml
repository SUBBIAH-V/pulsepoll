version: '3.8'

services:
  # MongoDB Container
  mongodb:
    image: mongo:6.0
    container_name: pulsepoll_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pulsepoll
    volumes:
      - mongo_data:/data/db

  # Redis Container
  redis:
    image: redis:7-alpine
    container_name: pulsepoll_redis
    restart: always
    ports:
      - "6379:6379"

  # Go Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsepoll_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: "production"
      MONGO_URI: "mongodb://mongodb:27017/pulsepoll"
      MONGO_DB_NAME: "pulsepoll"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "pulsepoll_production_secret_key_2026"
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
